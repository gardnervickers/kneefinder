[package]
name = "kneefinder"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
cli = ["dep:clap"]
web = ["dep:axum", "dep:futures-util", "dep:tokio"]

[dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "net", "rt-multi-thread", "sync"], optional = true }

[[bin]]
name = "kneefinder"
path = "src/main.rs"
required-features = ["cli"]
