[package]
name = "kneefinder-postgres-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Real PostgreSQL bottleneck demo for kneefinder"

[features]
web = ["kneefinder/web"]

[dependencies]
kneefinder = { path = "../..", default-features = false }
postgres = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
